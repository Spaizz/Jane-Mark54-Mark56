name: UI syntax check
on:
  push:
    branches:
      - mark56-feature-integration
  workflow_dispatch:
permissions:
  contents: read
jobs:
  py-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile integrated UI
        run: python -m py_compile ui-56-integrated.py
